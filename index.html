<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stereo Map · a camera that understands the space around it</title>
  <meta name="description" content="Two webcams in: a live 3D map of the building, measured distances to everything in view, and a voice you can ask.">
  <meta name="theme-color" content="#05070a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/radar.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <!-- Scroll: GSAP ScrollTrigger drives the room-to-radar move, Lenis smooths the wheel. The page still works without them. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script type="module" src="js/site/main.js"></script>
</head>
<body class="site">
  <div class="loader" id="loader" role="status" aria-label="Loading the 3D tour">
    <div class="loader-inner">
      <div class="bar"><i id="loaderBar"></i></div>
      <span class="mono pct" id="loaderPct">0%</span>
    </div>
  </div>

  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="stage-shade" id="stageShade" aria-hidden="true"></div>
  <div class="warp" id="warp" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Stereo Map home">
      <span class="logo" aria-hidden="true"><i></i><b></b><i></i></span>
      <span class="wordmark">Stereo<em>Map</em></span>
    </a>
  </header>

  <main>
    <!-- The 3D tour is the whole first screen: no words, just the room building itself. Drag to look around. -->
    <section class="hero" id="hero" aria-label="3D tour of a building being mapped">
      <div class="hud" aria-hidden="true">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      </div>
      <a class="scroll-hint" href="#measure" id="scrollHint" aria-label="Scroll to the two-camera rig"><i aria-hidden="true"></i></a>
      <button type="button" class="scan-btn" id="btnScan" aria-label="Scan your own space with your cameras">
        <span class="scan-ring" aria-hidden="true"><i></i></span>
        <span class="scan-label mono" aria-hidden="true">Scan your space</span>
      </button>
    </section>

    <section class="radar-sec" id="measure" aria-label="Measuring distance"></section>
  </main>

</body>
</html>
